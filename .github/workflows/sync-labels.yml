name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.json'
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Labels
        uses: EndBug/label-sync@v2
        with:
          config-file: '.github/labels.json'
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: false
